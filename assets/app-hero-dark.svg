<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" fill="none" role="img" aria-label="Biruk Hassen portfolio app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 180) rotate(90) scale(220 360)">
      <stop stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="48" x2="220" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="920" height="440" rx="20" ry="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Window -->
    <rect width="920" height="440" fill="url(#bg)"/>
    <rect x="220" y="48" width="700" height="392" fill="url(#glow)"/>

    <!-- Title bar -->
    <rect width="920" height="48" fill="#050505"/>
    <line x1="0" y1="48" x2="920" y2="48" stroke="#1E293B" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="24" r="6" fill="#FEBC2E"/>
    <circle cx="68" cy="24" r="6" fill="#28C840"/>
    <text x="460" y="30" text-anchor="middle" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">brookhassen.com</text>

    <!-- Sidebar -->
    <rect x="0" y="48" width="220" height="392" fill="url(#sidebar)"/>
    <line x1="220" y1="48" x2="220" y2="440" stroke="#1E293B" stroke-width="1"/>

    <!-- Code mark -->
    <g stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#soft)">
      <path d="M34 88 L22 104 L34 120"/>
      <path d="M58 84 L48 124"/>
      <path d="M70 88 L82 104 L70 120"/>
    </g>

    <!-- Avatar -->
    <defs>
      <clipPath id="avatar"><circle cx="110" cy="168" r="34"/></clipPath>
    </defs>
    <circle cx="110" cy="168" r="35" fill="#1E293B"/>
    <image href="https://brookhassen.com/assets/biruk-hassen.jpg" x="76" y="134" width="68" height="68" clip-path="url(#avatar)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="110" cy="168" r="35" stroke="#1E293B" stroke-width="2" fill="none"/>

    <!-- Nav -->
    <text x="36" y="238" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em">ABOUT</text>
    <rect x="24" y="246" width="172" height="2" fill="#E2E8F0" opacity="0.85"/>
    <text x="36" y="278" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em">EXPERIENCE</text>
    <text x="36" y="306" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em">PROJECTS</text>
    <text x="36" y="334" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em">SKILLS</text>
    <text x="36" y="362" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em">CONTACT</text>

    <!-- Social dots -->
    <circle cx="48" cy="404" r="5" fill="#5EEAD4" opacity="0.9"/>
    <circle cx="68" cy="404" r="5" fill="#334155"/>
    <circle cx="88" cy="404" r="5" fill="#334155"/>
    <circle cx="108" cy="404" r="5" fill="#334155"/>

    <!-- Main -->
    <text x="260" y="118" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.03em">Biruk Hassen</text>
    <text x="548" y="118" fill="#5EEAD4" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700">.</text>
    <text x="260" y="152" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500">Full-Stack Developer &amp; AI Engineer</text>
    <text x="260" y="188" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="15">I build web apps, train AI models, and craft the datasets</text>
    <text x="260" y="210" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="15">that make them actually work.</text>

    <!-- Widget cards -->
    <rect x="260" y="248" width="190" height="88" rx="14" fill="url(#card)" stroke="#1E293B"/>
    <text x="276" y="274" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">EXPERIENCE</text>
    <text x="276" y="298" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Eagle Point AI</text>
    <text x="276" y="318" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">Dataset Engineer · Lead</text>

    <rect x="466" y="248" width="190" height="88" rx="14" fill="url(#card)" stroke="#1E293B"/>
    <text x="482" y="274" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">FOCUS</text>
    <text x="482" y="298" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">LLM Training Data</text>
    <text x="482" y="318" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">Python · JS · SQL · Review</text>

    <rect x="672" y="248" width="190" height="88" rx="14" fill="url(#card)" stroke="#1E293B"/>
    <text x="688" y="274" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">STATUS</text>
    <text x="688" y="298" fill="#5EEAD4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Open to work</text>
    <text x="688" y="318" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">Freelance · AI roles</text>

    <!-- Wide card -->
    <rect x="260" y="352" width="602" height="56" rx="14" fill="url(#card)" stroke="#1E293B"/>
    <text x="276" y="378" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">SELECTED BUILD</text>
    <text x="276" y="398" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">Future Quest</text>
    <text x="372" y="398" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="13">·</text>
    <text x="386" y="398" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">PINNACLE AI</text>
    <text x="498" y="398" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="13">·</text>
    <text x="512" y="398" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">Frame by Frame</text>
    <text x="760" y="386" fill="#5EEAD4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Open ’</text>
  </g>
</svg>
